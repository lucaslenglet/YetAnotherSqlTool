name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Package and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release
      id-token: write # Marketplace Trusted Publishing (OIDC), no stored token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Verify tag matches package.json version
        id: version
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi
          minor="$(echo "$pkg_version" | cut -d. -f2)"
          if [ $((minor % 2)) -eq 1 ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "flag=--pre-release" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"

      - run: npm run typecheck
      - run: npm test

      - name: Package
        run: npx vsce package --no-dependencies ${{ steps.version.outputs.flag }} --out "yast-${{ steps.version.outputs.version }}.vsix"

      # Trusted Publishing: the publisher's policy on https://marketplace.visualstudio.com/manage
      # trusts this repository and this workflow file (publish.yml), no environment. Renaming the
      # file breaks the match. Azure DevOps global PATs are retired on 2026-12-01.
      - name: Publish to the VS Code Marketplace
        run: npx vsce publish --oidc --no-dependencies ${{ steps.version.outputs.flag }} --packagePath "yast-${{ steps.version.outputs.version }}.vsix"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish "yast-${{ steps.version.outputs.version }}.vsix" ${{ steps.version.outputs.flag }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          args=()
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "yast-${{ steps.version.outputs.version }}.vsix" \
            --title "$GITHUB_REF_NAME" --generate-notes "${args[@]}"
