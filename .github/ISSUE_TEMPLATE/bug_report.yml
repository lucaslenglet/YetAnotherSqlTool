name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Never paste passwords, tokens or connection strings with secrets.
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
      description: Help > About
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04...
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Database engine
      options: [SQL Server, PostgreSQL, Other]
    validations:
      required: true
  - type: input
    id: engine-version
    attributes:
      label: Database version
      placeholder: "SQL Server 2022, PostgreSQL 16..."
    validations:
      required: true
  - type: dropdown
    id: auth
    attributes:
      label: Authentication type
      options:
        - SQL login / password
        - Windows / integrated
        - Microsoft Entra ID (interactive)
        - Microsoft Entra ID (default / service principal)
        - Other
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output panel, developer tools console or error messages. Remove any sensitive data.
      render: text
