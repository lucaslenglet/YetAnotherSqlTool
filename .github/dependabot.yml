version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # tedious is pinned to an exact version on purpose: src/drivers/mssql/tediousRawValues.ts
      # wraps its internal value parser. Upgrade it by hand and run
      # test/drivers/mssql/cellFormats.integration.test.ts. Patch updates (and security
      # advisories) still produce PRs.
      - dependency-name: tedious
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Moves together with engines.vscode, by hand: vsce rejects types newer than the engine.
      - dependency-name: "@types/vscode"
      # Matches the Node.js of the oldest VS Code allowed by engines.vscode (Node 22), not the
      # Node.js of the development machine (.nvmrc).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (native compiler) waits for typescript-eslint support: a migration of its own.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # 0.x: a minor version can break. The webviews deep-import monaco-editor/esm/... paths
      # copied from vscode-mssql; upgrade by hand together with upstream.
      - dependency-name: monaco-editor
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Libraries of the webviews copied from vscode-mssql: new majors follow upstream (see
      # docs/vscode-mssql-analysis.md for the reference commit), by hand.
      - dependency-name: vscode-jsonrpc
        update-types: ["version-update:semver-major"]
      - dependency-name: slickgrid-react
        update-types: ["version-update:semver-major"]
      - dependency-name: "@fluentui/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@fluentui-contrib/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@monaco-editor/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        update-types: [minor, patch]
